version: 3

tasks:
  server:build:
    desc: Build Yachiyo server
    silent: true
    cmds:
      - mkdir -p build/server
      - go build -trimpath -o build/server/server{{exeExt}} yachiyo-runtime/server.go
      - cp README.md build/server
      - cp LICENSE build/server
      - cp -r assets/* build/server
      
  server:
    desc: Build and run Yachiyo server
    silent: true
    cmds:
      - task: server:build
      - cd build/server && ./server{{exeExt}}

  pancake:
    desc: Build Pancake
    dir: yachiyo-client/pancake
    silent: true
    cmds:
      - flutter pub get
      - flutter build {{.CLI_ARGS | default "windows"}}
  
  pancake:release:
    desc: Build Pancake (Release)
    dir: yachiyo-client/pancake
    silent: true
    cmds:
      - flutter pub get
      - flutter build {{.CLI_ARGS | default "windows"}} --release

  qq:build:
    desc: Build Yachiyo QQ client
    silent: true
    cmds:
      - mkdir -p build/qq
      - go build -trimpath -o build/qq/yachiyo-qq{{exeExt}} ./yachiyo-client/qq
      - cp yachiyo-client/qq/README.md build/qq
      - cp yachiyo-client/qq/README.en.md build/qq
      - cp yachiyo-client/qq/config.example.yaml build/qq
      - cp LICENSE build/qq

  qq:
    desc: Build and run Yachiyo QQ client
    silent: true
    cmds:
      - task: qq:build
      - cd build/qq && ./yachiyo-qq{{exeExt}}