version: 3

tasks:
  serverdev:
    desc: Run Yachiyo server in development mode
    silent: true
    env:
      YACHIYO_GLOBAL_MODE: development
      YACHIYO_CHAR_PATH: "{{.USER_WORKING_DIR}}/yachiyo-dev/package.yachiyo/prompts"
    dir: ./yachiyo-runtime
    cmds:
      - go run server.go
  clientdev:
    desc: Run Yachiyo Client in development mode
    silent: true
    dir: ./yachiyo-client/cli
    cmds:
      - go run main.go