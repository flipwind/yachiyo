version: 3

env:
  YACHIYO_GLOBAL_MODE: production # Default mode is production, and can be overridden by tasks.
  YACHIYO_CHAR_PATH: ./yachiyo-dev/package.yachiyo/prompts # Default character data path, consuming being under development.

tasks:
  serverdev:
    desc: Run Yachiyo Server in development mode
    silent: true
    env:
      YACHIYO_GLOBAL_MODE: development
      YACHIYO_CHAR_PATH: "{{.USER_WORKING_DIR}}/yachiyo-dev/package.yachiyo/prompts"
    dir: ./yachiyo-server
    cmds:
      - "echo [Yachiyo] Running Yachiyo Server in $YACHIYO_GLOBAL_MODE mode"
      - "echo [Yachiyo] Using character data from $YACHIYO_CHAR_PATH"
      - go run main.go
  
  proto:
    desc: Compile proto files
    cmds:
      - |
        protoc --proto_path=yachiyo-proto \
          --go_out=./ --go_opt=module=yachiyo \
          --go-grpc_out=./ --go-grpc_opt=module=yachiyo \
          yachiyo-proto/*.proto