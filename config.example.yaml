      curve:  sin((π/12)*(x+14))+0.5
      value:  0
      max:    24
      weight: 2

llm:
  default: deepseek
  providers:
    - enabled: True
      name: deepseek
      base_url: https://api.deepseek.com
      secret: <your-key-here>
      model: deepseek-v4-pro
      
    - enabled: True
      name: qwen3.7-plus
      base_url: <your-base-url-here>
      secret: <your-key-here>
      model: qwen3.7-plus
