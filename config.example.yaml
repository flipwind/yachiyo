nickname: Yachiyo

prompt:
  system: <dir-to-system-prompt>

gateway:
  onebot:
    enabled: True
    port: 16801
  client:
    enabled: True
    port: 16802

initiative:
  threshold: 0.9
  factors:
    sociability: 
      curve:  0.8
      value:  0.8
      max:    1
      weight: 1
    alonetime:
      curve:  1/(1+e^(-x+3))
      value:  0
      max:    10
      weight: 2
