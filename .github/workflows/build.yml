name: Build and Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-runtime:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            binary: server
            archive: yachiyo-runtime-linux-${{github.ref_name}}.tar.gz
            archive_command: tar -zcvf yachiyo-runtime-linux-${{github.ref_name}}.tar.gz -C build/server .

          - os: windows-latest
            platform: windows
            binary: server.exe
            archive: yachiyo-runtime-windows-${{github.ref_name}}.zip
            archive_command: powershell "Compress-Archive -Path 'build/server/*' -DestinationPath 'yachiyo-runtime-windows-${{github.ref_name}}.zip' -Force"
          
    name: Runtime Build (${{matrix.os}})
    runs-on: ${{matrix.os}}
    steps:
    - uses: actions/checkout@v6

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version-file: "go.mod"
        cache: true

    - name: Prepare Assets
      shell: bash
      run: |
        mkdir -p build/server
        cp README.md build/server
        cp LICENSE build/server
        cp -r assets/* build/server
    - name: Build Runtime
      shell: bash
      run: go build -trimpath -o build/server/${{matrix.binary}} yachiyo-runtime/server.go

    - name: Archive
      shell: bash
      run: ${{matrix.archive_command}}

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
       name: yachiyo-runtime-${{matrix.platform}}
       if-no-files-found: error
       path: ${{matrix.archive}}

  build-pancake:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: android
            archive: pancake-android-${{github.ref_name}}.apk
            build_command: flutter build apk --release

          - os: windows-latest
            platform: windows
            archive: pancake-windows-${{github.ref_name}}.zip
            build_command: flutter build windows --release
          
    name: Pancake Build (${{matrix.os}})
    runs-on: ${{matrix.os}}
    steps:
    - uses: actions/checkout@v6

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with: 
        channel: stable
        cache: true

    - name: Restore Android Signing Key
      if: matrix.platform == 'android'
      working-directory: yachiyo-client/pancake
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      shell: bash
      run: |
        set -euo pipefail

        test -n "$KEYSTORE_BASE64"
        test -n "$STORE_PASSWORD"
        test -n "$KEY_PASSWORD"
        test -n "$KEY_ALIAS"

        printf '%s' "$KEYSTORE_BASE64" \
          | base64 --decode > android/pancake-release.jks

        test -s android/pancake-release.jks

        {
          printf 'storePassword=%s\n' "$STORE_PASSWORD"
          printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          printf 'keyAlias=%s\n' "$KEY_ALIAS"
          printf 'storeFile=pancake-release.jks\n'
        } > android/key.properties

    - name: Install Dependencies
      working-directory: yachiyo-client/pancake
      run: flutter pub get
    
    - name: Build Pancake
      working-directory: yachiyo-client/pancake
      run: ${{matrix.build_command}}

    - name: Archive Windows
      if: matrix.platform == 'windows'
      working-directory: yachiyo-client/pancake
      shell: powershell
      run: Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "${{matrix.archive}}" -Force
    
    - name: Verify Android APK Signature
      if: matrix.platform == 'android'
      working-directory: yachiyo-client/pancake
      shell: bash
      run: |
        set -euo pipefail

        APK="build/app/outputs/flutter-apk/app-release.apk"
        APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
          -type f -name apksigner | sort -V | tail -n 1)"

        test -n "$APKSIGNER"
        "$APKSIGNER" verify --verbose "$APK"

    - name: Archive Android
      if: matrix.platform == 'android'
      shell: bash
      working-directory: yachiyo-client/pancake
      run: cp build/app/outputs/flutter-apk/app-release.apk "${{matrix.archive}}"

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
       name: pancake-${{matrix.platform}}
       if-no-files-found: error
       path: yachiyo-client/pancake/${{matrix.archive}}
    
    - name: Clean Android Signing Key
      if: always() && matrix.platform == 'android'
      working-directory: yachiyo-client/pancake
      shell: bash
      run: |
        rm -f android/key.properties
        rm -f android/pancake-release.jks
  
  release:
    name: Create Release
    needs: 
      - build-runtime
      - build-pancake
    runs-on: ubuntu-latest

    permissions:
      contents: write
    
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v5
        with: 
          path: release
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with: 
          generate_release_notes: true
          files: | 
            release/yachiyo-runtime-linux/*
            release/yachiyo-runtime-windows/*
            release/pancake-windows/*
            release/pancake-android/*
